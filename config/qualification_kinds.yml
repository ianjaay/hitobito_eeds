# frozen_string_literal: true

# Catalogue des QualificationKinds EEDS
# 60 JEEGO (4 branches × 5 domaines × 3 niveaux)
# + 8 MËN-MËN (brevets individuels)
#
# Convention de nommage :
#   JEEGO : jeego_{branche}_{domaine}_{niveau}
#   MËN-MËN : men_{specialite}

# ────────────────────────────────────────────────────────────
# JEEGO — Progression collective
# ────────────────────────────────────────────────────────────

# Branches et leurs codes internes
branches:
  mbootaay:
    label: "Mbootaay"
    age_range: "6-8"
  kayon:
    label: "Kayon"
    age_range: "8-12"
  dental:
    label: "Dental"
    age_range: "12-16"
  galle:
    label: "Gàlle"
    age_range: "16-20"

# Domaines pédagogiques
domaines:
  enab_physique:
    label: "Enabilité physique"
    description: "Endurance, hygiène de vie, sport"
  enab_intellectuel:
    label: "Enabilité intellectuelle"
    description: "Réflexion, observation, techniques"
  donn_social:
    label: "Donnerie / Njaak social"
    description: "Vie en société, service, entraide"
  yees_spirituel:
    label: "Yeesal / Spiritualité"
    description: "Valeurs, engagement, spiritualité"
  enab_affectif:
    label: "Enabilité affective"
    description: "Expression, émotions, relations"

